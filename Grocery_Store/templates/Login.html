<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grocery Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">


    <style>
        /* --- COLOR PALETTE (Consistent Theme) --- */
        :root {
            --bs-primary: #32CD32; /* Lime Green */
            --bs-primary-rgb: 50, 205, 50;
            --bs-success: #32CD32;
            --bs-success-rgb: 50, 205, 50;
            --bs-danger: #DC3545;
            --bs-secondary: #6c757d;
            --bs-dark-black: #000000;
            --bs-light: #f7f9fc;
            --bs-white: #ffffff;
            --bs-body-font-family: 'Poppins', sans-serif;
            --bs-heading-font-family: 'Playfair Display', serif;
        }

        body {
            font-family: var(--bs-body-font-family);
            background-color: var(--bs-light);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 75px; /* Space for fixed navbar */
        }

        /* --- Navbar/Header (Consistent Style) --- */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1030;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            background-color: var(--bs-white) !important;
        }

        .navbar-brand {
            color: var(--bs-primary) !important;
            font-size: 1.8rem !important;
            font-weight: 700 !important;
        }
        .navbar-brand .bi-bag-fill {
            font-size: 1.5rem;
            color: var(--bs-primary);
        }

        /* Button/Form Styling */
        .btn-success {
             background-color: var(--bs-primary) !important;
             border-color: var(--bs-primary) !important;
             color: var(--bs-white) !important;
             font-weight: 700;
             transition: transform 0.2s, opacity 0.2s;
             border-radius: 0.5rem; /* Smoother button look */
        }
        .btn-success:hover {
             transform: translateY(-2px);
             opacity: 0.9;
        }
        .form-control:focus {
            border-color: var(--bs-primary);
            box-shadow: 0 0 0 0.25rem rgba(50, 205, 50, 0.25);
        }
        .card {
             border-radius: 1rem;
             border: none;
        }

        /* --- Footer (Consistent Style) --- */
        .footer-bg { background-color: #2c3e50 !important; color: #ccc; margin-top: auto; }
        .footer-bg h5 {
            color: var(--bs-primary) !important;
            font-weight: 700;
            border-left: 3px solid #ccc;
            padding-left: 10px;
        }
        .footer-bg a { color: #ccc !important; text-decoration: none;}
        .footer-bg a:hover { color: var(--bs-primary) !important; }
        .footer-bg .fs-4:hover { color: var(--bs-primary) !important; }
    </style>
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

<nav class="navbar navbar-expand-lg navbar-light sticky-top">
    <div class="container-xl">
        <a class="navbar-brand fw-bold" href="#">
            <i class="bi bi-bag-fill me-2"></i>
            Grocery Store
        </a>
    </div>
</nav>
<main class="flex-fill container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-lg border-0">
                <h3 class="text-center mb-4">Login</h3>

                <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <strong>✔ Successfully Registered!</strong> You can now login.
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <strong>Invalid Email or Password</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${param.errors}" class="alert alert-warning">
                    Please login to access your cart!
                </div>
                <div th:if="${param.erroritem}" class="alert alert-warning">
                    Please login to add your cart item!
                </div>

                <form th:action="@{/api/login}" method="post">

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <div class="input-group">
                            <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control"
                                    required
                                    autocomplete="current-password" />
                            <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Toggle password visibility">
                                <i class="bi bi-eye-slash" id="toggleIcon"></i>
                            </button>
                        </div>
                    </div>


                    <button class="btn btn-success w-100">Login</button>

                    <div class="text-center mt-3">
                        <p>New here? <a th:href="@{/api/Signup}" class="text-success text-decoration-none fw-semibold">Create an account</a></p>
                    </div>

                </form>

            </div>
        </div>
    </div>
</main>

<footer class="footer-bg pt-5 pb-3 mt-5">
    <div class="container">
        <p class="text-center mb-0 small text-white">
            &copy; 2025 Grocery Store. All rights reserved.
        </p>
    </div>

</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (!toggleBtn || !passwordInput || !toggleIcon) {
        // If any element missing, bail out (helps debugging)
        console.warn('Password toggle elements not found');
        return;
      }

      toggleBtn.addEventListener('click', function () {
        // toggle input type
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';

        // toggle icon classes
        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
      });
    })();
</script>
</body>
</html>
